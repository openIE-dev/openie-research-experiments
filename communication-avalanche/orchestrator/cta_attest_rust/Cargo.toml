[package]
name = "cta_attest_rust"
version = "0.1.0"
edition = "2021"
description = "Event-driven thresholded orchestration graph with BLAKE3 + Ed25519 channel attestation, Successive Shortest Path min-cost flow, and Linux RAPL telemetry"

[dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
