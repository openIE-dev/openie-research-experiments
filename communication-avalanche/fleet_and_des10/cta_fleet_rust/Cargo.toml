[package]
name = "cta_fleet_rust"
version = "0.2.0"
edition = "2021"
description = "Cross-platform 5-host CTA benchmark: BLAKE3 + Ed25519 attestation, 16-node zero-clock threshold DAG vs 1000 Hz polling, SSP min-cost flow, and hardware shunt/RAPL/Darwin/NVML telemetry"

[dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
