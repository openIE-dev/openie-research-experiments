[package]
name = "alif-lut6-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
description = "Bare-metal Alif Ensemble E3/E4 Cortex-M55 HE (thumbv8m.main-none-eabihf) MRAM + Zero-Wait DTCM LUT6 Nucleus benchmark firmware"

[dependencies]
lut6-core = { path = "../lut6-core", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
